MACS3_VERSION=3.0.5
MACS3_COMMIT=c5443190e3edfeb301cc94acf450e2b2c026a223
# Where the checkout lives is a property of the machine, not of the pin, so it is
# deliberately not recorded here: the last writer's `/home/...` or `/scratch/...`
# path is meaningless to everyone else and silently disabled the oracle lookup on
# CI. `oracle/provision_oracle.sh` writes the real location to
# `oracle/ENV.provisioned` and exports MACS3_SRC/MACS3_VENV; consumers read the
# environment first and fall back to that record. MACS3_PATH stays as a key (the
# recorded path is `<checkout>/MACS3/__init__.py`) because the last-resort readers
# in verify_oracle_clean.sh and provision_oracle.sh key off it, and an empty value
# is what tells them "ask the environment".
MACS3_PATH=
PYTHON=3.12.3
NUMPY=2.5.3
SCIPY=1.18.1
SKLEARN=1.9.1
HMMLEARN=0.3.3
CYTHON_BUILD=3.3.0
OPENBLAS_CORETYPE=Haswell
VECTORS=4371
# F93: MACS3_VERSION was recorded as `unknown`, which broke the
# `oracle_lock_records_the_pinned_version` test that guards the oracle's identity.
# It is read from `MACS3/Utilities/Constants.py` (`MACS_VERSION = "3.0.5"`) at the
# pinned commit, and the commit is recorded here so the pin is checkable rather
# than asserted.
# The oracle is HERMETIC: the working tree is byte-identical to c5443190 and the
# built extensions match the pre-instrumentation build. Verify with
# `oracle/verify_oracle_clean.sh`.
#
# Earlier work instrumented MACS3 in place (option 1a) to capture intermediates.
# That is no longer necessary: `oracle/dump_stages.py` drives the real pipeline
# and records what it computed, which reaches everything the instrumentation
# exposed -- including `__chrom_pair_treat_ctrl`'s paired position/treatment/
# control arrays (F60/F64a) -- without modifying the oracle. The instrumented
# sources were restored from /tmp/CallPeakUnit.py.orig and
# /tmp/oracle_so_backup/; all four peak gates and the signal gate re-verified
# unchanged afterwards.
