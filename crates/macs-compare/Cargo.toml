[package]
name = "macs-compare"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
documentation = "https://docs.rs/macs3-rs"
description = "Genomic-aware differential comparator between MACS3 and macs3-rs"

[lib]
name = "macs_compare"
path = "src/lib.rs"

[[bin]]
name = "macs-compare"
path = "src/main.rs"

[dependencies]
macs-core = { workspace = true }
macs-rle = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }

[dev-dependencies]
tempfile = "3"
