[workspace]
exclude = ["fuzz"]
resolver = "2"
members = [
    "crates/macs-core",
    "crates/macs-stats",
    "crates/macs-rle",
    "crates/macs-io",
    "crates/macs-track",
    "crates/macs-pileup",
    "crates/macs-score",
    "crates/macs-model",
    "crates/macs-peaks",
    "crates/macs-bedgraph",
    "crates/macs-hmmratac",
    "crates/macs-callvar",
    "crates/macs-cli",
    "crates/macs-compare",
]

[workspace.package]
version = "0.1.0"
edition = "2021"
rust-version = "1.83"
license = "BSD-3-Clause"
repository = "https://github.com/mobashirrahman/macs3-rust"
homepage = "https://github.com/mobashirrahman/macs3-rust"
readme = "README.md"
description = "Pure-Rust reimplementation of MACS3 (Model-based Analysis for ChIP-Seq)"

[workspace.dependencies]
macs-core = { version = "0.1.0", path = "crates/macs-core" }
macs-stats = { version = "0.1.0", path = "crates/macs-stats" }
macs-rle = { version = "0.1.0", path = "crates/macs-rle" }
macs-io = { version = "0.1.0", path = "crates/macs-io" }
macs-track = { version = "0.1.0", path = "crates/macs-track" }
macs-pileup = { version = "0.1.0", path = "crates/macs-pileup" }
macs-score = { version = "0.1.0", path = "crates/macs-score" }
macs-model = { version = "0.1.0", path = "crates/macs-model" }
macs-peaks = { version = "0.1.0", path = "crates/macs-peaks" }
macs-bedgraph = { version = "0.1.0", path = "crates/macs-bedgraph" }
macs-hmmratac = { version = "0.1.0", path = "crates/macs-hmmratac" }
macs-callvar = { version = "0.1.0", path = "crates/macs-callvar" }

clap = { version = "4", features = ["derive", "wrap_help"] }
thiserror = "2"
rayon = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
anyhow = "1"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
flate2 = "1"
noodles = { version = "0.6", features = ["bam", "sam", "bgzf", "core"] }
proptest = "1"
criterion = { version = "0.5", features = ["html_reports"] }

[profile.release]
opt-level = 3
lto = "fat"
codegen-units = 1
panic = "unwind"
debug = 1

[profile.bench]
inherits = "release"
